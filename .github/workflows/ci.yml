name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check harness engines
      - run: uv run pytest

  parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: .irbench/data
          key: datasets-${{ hashFiles('datasets/**/dataset.yaml') }}
      - run: uv run irbench prepare --scenario ecommerce/product-search
      - run: uv run irbench lint

  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -m docker -v

  loadgen:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_PASSWORD: irbench
          POSTGRES_DB: irbench
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d irbench" --health-interval 2s --health-retries 30
      paradedb:
        image: paradedb/paradedb:0.26.1-pg17
        env:
          POSTGRES_PASSWORD: irbench
          POSTGRES_DB: irbench
        ports: ["15433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d irbench" --health-interval 2s --health-retries 30
    defaults:
      run:
        working-directory: loadgen
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: loadgen
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test -- --ignored
        env:
          IRBENCH_PG_URL: postgresql://postgres:irbench@localhost:15432/irbench
          IRBENCH_PARADEDB_URL: postgresql://postgres:irbench@localhost:15433/irbench

  docs:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npx --yes mint@4.2.1006 broken-links

  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run irbench report --results results --out site

id: ecommerce/product-search
dataset: wands
id_field: id

# Order of `searchable` is the field priority every engine must respect.
index_fields:
  searchable: [name, product_class, category, features, description]
  filterable: [product_class, category, average_rating, review_count]
  sortable: [average_rating, review_count]
  facets: [product_class]
  # Numeric fields: range filters and sorting apply to these only.
  numeric: [average_rating, review_count]

modes: [keyword, semantic, hybrid, filtered, sorted, faceted]
# filtered/sorted/faceted run on top of each of these retrieval bases.
structured_bases: [keyword, semantic]

# Doc text sent to embedding models: these fields, joined with ". ", empty ones skipped.
embedding_fields: [name, product_class, description]

filter_templates:
  - {field: product_class, op: eq}
  - {field: average_rating, op: gte, values: [3.0, 4.0, 4.5]}

sort_templates:
  - {field: average_rating, direction: desc}
  - {field: review_count, direction: desc}

top_k: 100
# Facet value limit every engine must return (WANDS has 601 product_class values).
max_facet_values: 1000
# Faceted checks re-fetch the same query up to this many hits; at or above it the
# result set is too large to verify and the task is reported "unverifiable".
facet_verify_limit: 1000
# Relevance-stage request timeout; a timeout scores the task 0 and is logged.
request_timeout_s: 10
# Above this share of failed relevance requests the run fails instead of
# publishing zeros for a crashed or misconfigured engine (perf uses the same 0.1%).
max_error_rate: 0.001
index_timeout_s: 1800

perturbations:
  seed: 20261009
  kinds: [typo, prefix, synonym]
  vocabulary: vocab_mismatch.txt

synonyms: synonyms.txt

# Load protocol for the perf stage (spec §5.7), identical for every engine.
perf:
  concurrency: [1, 2, 4, 8, 16, 32, 64]
  step_seconds: 20
  p99_limit_ms: 100
  max_error_rate: 0.001
  # Throughput runs on the retrieval bases; latency covers every mode.
  throughput_groups: [keyword/keyword, semantic/semantic, hybrid/hybrid]
  warmup_concurrency: 4
  # Speed is measured at each page size, same protocol; relevance always uses top_k.
  # 20: a search results page (headline). 100: deep retrieval (reranking, RAG).
  page_sizes: [20, 100]

[project]
name = "irbench"
version = "0.1.0"
description = "Neutral, reproducible information retrieval benchmark for search engines and embedding models"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "pyarrow>=16",
  "numpy>=1.26",
  "ranx>=0.3.21",
  "jinja2>=3.1",
]

[project.optional-dependencies]
embed-local = ["sentence-transformers>=3.0"]
embed-api = ["openai>=1.40"]

[project.scripts]
irbench = "irbench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
 "pytrec-eval-terrier>=0.5.7",
 "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness/irbench"]

[tool.pytest.ini_options]
testpaths = ["harness/tests"]
markers = [
  "slow: needs network or large models",
  "docker: starts real engine containers (run with -m docker)",
]
addopts = "-m 'not slow and not docker'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# Test helpers are imported as top-level modules (pytest rootdir import mode).
known-first-party = [
  "irbench", "conftest", "test_prepare", "test_embed_cache",
  "fake_engine", "adapter_helpers", "contract_fixture", "report_fixtures",
]

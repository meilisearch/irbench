# Elasticsearch on knowledge-base/web-questions.
#
# default: Elasticsearch as shipped. adapter.py generates only what the
#   scenario schema requires (mapping, field boosts
#   from the scenario's priority order, dense_vector).
#   Not enabled by default: fuzziness, prefix matching, stemming. Hybrid uses
#   the rrf retriever (trial license, see README).
# tuned: changes within the parity rules. Add a `tuned:` block here; it is
#   deep-merged over `default`. Example: fuzziness on keyword queries:
#     tuned:
#       search:
#         keyword: {query: {multi_match: {fuzziness: AUTO}}}
#
# Keys: index (merged into the create-index body), search.<keyword|semantic|hybrid>
# (merged into search bodies of that base), unsupported, justification.
default:
  index: {}
  search: {}
  unsupported: {}
# tuned: the best settings found by sweeps of the engine's documented settings, scored on
# nDCG@10 per scenario and retrieval base (2026-10-20), then re-checked by the committed sweep
# in sweeps/ on the tune half of the queries (2026-11-06; selection rule in
# docs/methodology/parity). Hybrid stays the engine's native fusion.
tuned:
  index:
    stemming: english
    stop_words: english
  search:
    hybrid:
      multi_match:
        type: best_fields
        fuzziness: '0'
      fusion:
        method: linear
        weights:
        - 1
        - 2.5
  justification:
    stemming: See stop_words.
    stop_words: '`stemming: english, stop_words: english`: the engine''s English analysis, part of what it ships
      (the parity rules turn on each engine''s language features). Keyword nDCG@10 0.349 -> 0.380,
      hybrid 0.551 -> 0.549 (2026-11-06 sweep, tune half).'
    hybrid.multi_match: 'The keyword side of hybrid keeps the defaults (`best_fields`, no
      fuzziness): with the vector side weighted 2.5x, typo tolerance on the keyword side lowers
      hybrid. Hybrid nDCG@10 0.551 -> 0.558 against `most_fields` with `fuzziness: AUTO` (2026-11-06 sweep, tune half).'
    fusion: 'The native `linear` retriever: min-max normalized scores, the vector side weighted
      2.5x. On these question queries keyword matching is weak, so the best fusion leans on the
      vector side.'

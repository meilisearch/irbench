# Sweep for elasticsearch on knowledge-base/covid-papers, generated by scripts/make_sweeps.py.
# Each variant is merged over the tuned track and runs as `tuned+<variant>` on the
# tune half of the queries; the report publishes the test half.
variants:
  base: {}
  lang:
    index: &id001
      stop_words: english
      stemming: english
  stem:
    index:
      stemming: english
  stop:
    index:
      stop_words: english
  lang-alt:
    index: *id001
    search:
      keyword:
        multi_match:
          type: best_fields
  alt-a:
    search:
      keyword:
        multi_match:
          type: best_fields
      hybrid:
        fusion:
          weights:
          - 1
          - 2
  alt-b:
    search:
      keyword:
        multi_match:
          type: best_fields
      hybrid:
        fusion:
          weights:
          - 2
          - 1
  fuzz:
    search:
      keyword:
        multi_match:
          type: most_fields
          fuzziness: '0'
      hybrid:
        multi_match:
          type: most_fields
          fuzziness: '0'

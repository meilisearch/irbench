# Sweep for meilisearch on knowledge-base/web-questions, generated by scripts/make_sweeps.py.
# Each variant is merged over the tuned track and runs as `tuned+<variant>` on the
# tune half of the queries; the report publishes the test half.
variants:
  base: {}
  last:
    search:
      keyword:
        matchingStrategy: last
      hybrid:
        hybrid:
          semanticRatio: 0.4
  all:
    search:
      keyword:
        matchingStrategy: all
      hybrid:
        hybrid:
          semanticRatio: 0.7
  rules:
    index:
      rankingRules:
      - sort
      - words
      - attributeRank
      - typo
      - proximity
      - wordPosition
      - exactness
  typo-3-6:
    index:
      typoTolerance:
        minWordSizeForTypos:
          oneTypo: 3
          twoTypos: 6
  typo-4-8:
    index:
      typoTolerance:
        minWordSizeForTypos:
          oneTypo: 4
          twoTypos: 8
  dist:
    index: &id001
      embedders:
        default:
          distribution:
            mean: 0.868
            sigma: 0.029
  dist-ratio:
    index: *id001
    search:
      hybrid:
        hybrid:
          semanticRatio: 0.4

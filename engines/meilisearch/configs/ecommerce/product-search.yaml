# Meilisearch on ecommerce/product-search.
#
# default: Meilisearch as shipped. adapter.py generates only what the scenario
#   schema requires (searchable order, filterable/sortable/facet fields,
#   synonyms.txt, userProvided embedder, facet value limit).
# tuned: changes within the parity rules (docs/methodology/parity). Add a
#   `tuned:` block here; it is deep-merged over `default`.
#
# Keys: index (merged into index settings), search.<keyword|semantic|hybrid>
# (merged into search bodies of that base), unsupported (key -> reason),
# justification (key -> why a non-default ANN or ranking parameter is set).
default:
  index:
    # Default rules with `sort` moved first (see justification).
    rankingRules: [sort, words, typo, proximity, attributeRank, wordPosition, exactness]
  search: {}
  unsupported: {}
  justification:
    rankingRules: >-
      The scenario's sorted mode requires results ordered by the sort field.
      With the shipped order, `sort` ranks after words/typo/proximity/attributeRank
      (and after vector similarity), so it only breaks ties. Moving it first makes
      `sort` strict on both bases. Requests without `sort` are unaffected: the
      rule is inactive without a sort parameter (checked on v1.54.3 for keyword,
      semantic and hybrid queries).
# tuned: the best settings found by a sweep of the engine's documented search settings,
# scored on nDCG@10 per scenario and retrieval base (2026-10-20). Typo tolerance, prefix
# search and stemming stay at the engine's defaults; hybrid stays the engine's native
# fusion.
tuned:
  search:
    keyword:
      matchingStrategy: frequency
    hybrid:
      matchingStrategy: frequency
      hybrid:
        semanticRatio: 0.45
  justification:
    matchingStrategy: With the default `last`, Meilisearch drops words from the end of the query
      until something matches, so the last word goes first. `frequency` drops the most frequent
      words first. A documented search parameter. Keyword nDCG@10 0.481 -> 0.508 (also the best
      for hybrid here).
    hybrid.semanticRatio: '`semanticRatio` 0.45 (default 0.5) weights the keyword side slightly more
      in Meilisearch''s native hybrid search; the sweep tried 0.2 to 0.95. Hybrid nDCG@10 0.616
      -> 0.622.'

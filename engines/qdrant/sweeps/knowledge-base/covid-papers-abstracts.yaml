# Sweep for qdrant on knowledge-base/covid-papers-abstracts, generated by scripts/make_sweeps.py.
# Each variant is merged over the tuned track and runs as `tuned+<variant>` on the
# tune half of the queries; the report publishes the test half.
variants:
  base: {}
  avg-len:
    index:
      bm25_avg_len: shipped
  k-1.2-b-0.75:
    index:
      bm25_options:
        k: 1.2
        b: 0.75
  k-1.5:
    index:
      bm25_options:
        k: 1.5
        b: 0.75
  b-0.5:
    index:
      bm25_options:
        k: 1.2
        b: 0.5
  k-0.9-b-0.4:
    index:
      bm25_options:
        k: 0.9
        b: 0.4
  fusion-a:
    search:
      hybrid:
        fusion:
          fusion: rrf
  fusion-b:
    search:
      keyword:
        keyword_pool: 100
      hybrid:
        fusion:
          rrf:
            k: 60
            weights:
            - 1
            - 3

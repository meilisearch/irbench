# Qdrant on ecommerce/product-search.
#
# default: Qdrant as shipped. adapter.py generates only what the scenario
#   schema requires (a Cosine dense vector, one BM25 sparse vector per searchable
#   field, payload indexes for filterable, sortable and facet fields). HNSW and
#   search parameters are Qdrant's defaults.
# tuned: changes within the parity rules; add a `tuned:` block (deep-merged).
#
# Keys: index (merged into the create-collection body),
# synonyms (why synonyms.txt is not loaded, shown on the run page),
# search.<keyword|semantic|hybrid> (merged into query bodies of that base),
# unsupported (key -> reason, shown as N/A in results), justification.
default:
  index: {}
  search: {}
  unsupported:
    faceted: >-
      Qdrant's facet API counts the points matching a filter, not the points
      returned by a query, so counts cannot describe the query's results.
  synonyms: >-
    Qdrant has no synonym support: its BM25 tokenizer takes no synonym list, and
    expanding queries in the harness would break the parity rules.
# tuned: the best settings found by a sweep of the engine's documented search settings,
# scored on nDCG@10 per scenario and retrieval base (2026-10-20). Typo tolerance, prefix
# search and stemming stay at the engine's defaults; hybrid stays the engine's native
# fusion.
tuned:
  search:
    keyword:
      keyword_pool: 1000
    hybrid:
      fusion:
        rrf:
          k: 60
          weights:
          - 1
          - 3
      keyword_pool: 1000
  justification:
    keyword_pool: Each per-field BM25 prefetch keeps 1000 candidates instead of the request depth
      (100), so a document that is not in any single field's top 100 can still win on the weighted
      sum of fields. Keyword nDCG@10 0.556 -> 0.567 with the settings of this track.
    fusion: Native RRF (k = 60) with the vector ranking weighted 3x (Qdrant's weighted `rrf`).
      Hybrid nDCG@10 0.589 -> 0.622.

# Pinned engine image. The resolved digest is recorded in every run manifest.
services:
  engine:
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    container_name: irbench-qdrant
    ports:
      - "16333:6333"
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - data:/qdrant/storage
    healthcheck:
      # The image ships without curl/wget; bash's /dev/tcp checks the port is open.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  data:

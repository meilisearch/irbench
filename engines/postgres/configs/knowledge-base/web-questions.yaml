# Postgres 17 + pgvector on knowledge-base/web-questions.
#
# default: Postgres as shipped plus the minimum to load the scenario: a weighted
#   tsvector over the searchable fields (setweight A-D in scenario order), the
#   english text search configuration, pgvector HNSW at its defaults,
#   B-tree/GIN indexes on filter and sort fields.
# tuned: changes within the parity rules (docs/methodology/parity); add a `tuned:`
#   block here, deep-merged over `default`.
#
# Keys: index.settings (database-level GUCs), unsupported (key -> reason),
# justification (key -> why a non-default setting is set).
default:
  index:
    settings:
      hnsw.ef_search: 100
      hnsw.iterative_scan: relaxed_order
  search: {}
  unsupported: {}
  justification:
    settings.hnsw.ef_search: >-
      pgvector's HNSW candidate pool is ef_search (default 40), and one scan
      cannot return more rows than that. 100 is the smallest value that returns
      the scenario's top_k = 100 without relying on iterative scans. The other
      engines' pools differ: the Elasticsearch adapter sets only k = top_k, so
      num_candidates defaults to 1.5 * k = 150; the Qdrant adapter sets no ef,
      so search ef defaults to the collection's ef_construct (100). Build
      parameters also differ: HNSW m is 16 everywhere, ef_construction is 64
      in pgvector's defaults against 100 in Elasticsearch and Qdrant.
    settings.hnsw.iterative_scan: >-
      Without iterative scans (off by default in pgvector 0.8), a filtered
      vector query keeps only the ef_search nearest rows before filtering and
      can return fewer than top_k results. relaxed_order is pgvector's
      documented setting for filtered queries.
# tuned: the best settings found by a sweep of the engine's documented search settings,
# scored on nDCG@10 per scenario and retrieval base (2026-10-20). Typo tolerance, prefix
# search and stemming stay at the engine's defaults; hybrid stays the engine's native
# fusion.
tuned:
  search:
    keyword:
      match: any
      normalization: 1
    hybrid:
      rrf:
        weights:
        - 1
        - 2
  justification:
    match: '`match: any` ORs the words of `websearch_to_tsquery` (same parsing, stemming and thesaurus)
      instead of requiring all of them, the way BM25 engines match: Postgres as shipped needs
      every query word, so a long or partly-off query matches nothing. Written in the SQL the
      engine runs, no harness-side rewriting. Costs speed: every matching document is ranked.
      Keyword nDCG@10 0.083 -> 0.292.'
    normalization: '`ts_rank` normalization 1 divides the rank by 1 + log(document length), so
      long documents do not win on length alone (Postgres documented flag).'
    rrf: Reciprocal rank fusion still runs in one SQL statement inside the database (k = 60);
      `weights` scales each side's 1 / (k + rank) term, [keyword, vector]. Hybrid nDCG@10 0.523
      -> 0.535 with the vector ranking weighted 2x; the hybrid keyword side keeps AND matching,
      which scored better here.

# Sweep for postgres on knowledge-base/covid-papers, generated by scripts/make_sweeps.py.
# Each variant is merged over the tuned track and runs as `tuned+<variant>` on the
# tune half of the queries; the report publishes the test half.
variants:
  base: {}
  match:
    search:
      keyword:
        match: all
      hybrid:
        rrf:
          weights:
          - 1
          - 1
  cd:
    search:
      keyword:
        rank: ts_rank_cd
      hybrid:
        rrf:
          weights:
          - 2
          - 1
  norm-1:
    search:
      keyword:
        normalization: 1
      hybrid:
        rrf:
          weights:
          - 1
          - 3
  norm-2:
    search:
      keyword:
        normalization: 2
      hybrid:
        rrf:
          k: 20
  norm-32:
    search:
      keyword:
        normalization: 32
      hybrid:
        match: any

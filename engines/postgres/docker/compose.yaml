# Pinned engine image. The resolved digest is recorded in every run manifest.
services:
  engine:
    image: pgvector/pgvector:0.8.7-pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    container_name: irbench-postgres
    # Docker's default /dev/shm (64 MB) is too small for parallel index builds and
    # parallel queries, which allocate dynamic shared memory; both Postgres engines get 2 GB.
    shm_size: 2gb
    ports:
      - "15432:5432"
    environment:
      POSTGRES_PASSWORD: irbench   # local benchmark only
      POSTGRES_DB: irbench
    volumes:
      - data:/var/lib/postgresql/data
      # synonyms.txt as a Postgres thesaurus dictionary (generated; see README)
      - ./tsearch/irbench_ecommerce_product_search.ths:/usr/share/postgresql/17/tsearch_data/irbench_ecommerce_product_search.ths:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d irbench"]
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  data:

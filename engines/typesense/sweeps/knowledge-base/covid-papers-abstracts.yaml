# Sweep for typesense on knowledge-base/covid-papers-abstracts, generated by scripts/make_sweeps.py.
# Each variant is merged over the tuned track and runs as `tuned+<variant>` on the
# tune half of the queries; the report publishes the test half.
variants:
  base: {}
  lang:
    index: &id001
      stop_words: english
      stemming: english
  stem:
    index:
      stemming: english
  stop:
    index:
      stop_words: english
  alt-a:
    search:
      keyword:
        drop_tokens_threshold: 10
      hybrid:
        vector_query_options:
          alpha: 0.3
  alt-b:
    search:
      keyword:
        text_match_type: max_score
      hybrid:
        vector_query_options:
          alpha: 0.7
  alt-c:
    search:
      keyword:
        drop_tokens_mode: both_sides:3
      hybrid:
        rerank_hybrid_matches: false
  lang-alt:
    index: *id001
    search:
      keyword:
        drop_tokens_threshold: 10
      hybrid:
        text_match_type: max_weight

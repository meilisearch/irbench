# Typesense on knowledge-base/web-questions.
#
# default: Typesense as shipped. adapter.py generates only what the scenario
#   schema requires (optional string*/float fields, facet flags, a float[] vector
#   field, the synonyms.txt synonym set, field weights n - i from the scenario's
#   priority order). Typo tolerance and prefix search are on by default.
# tuned: changes within the parity rules; a `tuned:` block is deep-merged over
#   `default`.
#
# Keys: index (merged into the create-collection body; `searchable_fields` is
# merged into every searchable field, `fields.<name>` into one field,
# `stopwords.<set>` creates a stopword set), search.<keyword|semantic|hybrid>
# (merged into each search of that base), unsupported, justification.
default:
  index: {}
  search: {}
  unsupported: {}
tuned:
  search:
    keyword:
      drop_tokens_threshold: 250
      drop_tokens_mode: left_to_right
      text_match_type: max_weight
    hybrid:
      text_match_type: sum_score
      rerank_hybrid_matches: true
      vector_query_options: {alpha: 0.95}
  justification:
    drop_tokens_threshold: >-
      Typesense's default (1) drops query words only when nothing matches all of them, so
      a long or partly-off query returns few or no results. Dropping words until 250 documents match, the first words of the
      query first (`drop_tokens_mode: left_to_right`; the default drops the last ones), is
      the best keyword setting of the sweep on average over the four scenarios, at most
      0.013 below any one scenario's best. A documented search parameter.
    drop_tokens_mode: See drop_tokens_threshold.
    text_match_type: >-
      `max_weight` ranks by the best-weighted matching field instead of the raw best field
      score, so field priority counts more; best keyword setting of the sweep with the
      threshold above. Hybrid uses `sum_score` (adds the field scores), the best hybrid setting of the sweep here. A documented search parameter.
    rerank_hybrid_matches: >-
      Scores the documents found by only one side on the other side too before fusion,
      instead of giving them no score there. A documented hybrid search parameter.
    vector_query_options: >-
      `alpha` 0.95 (default 0.3) is the vector side's weight in Typesense's native rank
      fusion; hybrid nDCG@10 0.380 -> 0.551 in the sweep; on these question queries keyword matching is weak (0.09) so the best fusion leans on the vector side; dropping words lowers hybrid here.
  # Stemming and stop words stay off: the parity rules keep stemming at each engine's
  # language default, and no other engine removes stop words.

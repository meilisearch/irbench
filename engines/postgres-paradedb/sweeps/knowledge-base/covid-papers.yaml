# Sweep for postgres-paradedb on knowledge-base/covid-papers, generated by scripts/make_sweeps.py.
# Each variant is merged over the tuned track and runs as `tuned+<variant>` on the
# tune half of the queries; the report publishes the test half.
variants:
  base: {}
  lang:
    index: &id001
      stop_words: english
      stemming: english
  stem:
    index:
      stemming: english
  stop:
    index:
      stop_words: english
  fuzzy:
    search:
      keyword:
        fuzzy: 1
      hybrid:
        fuzzy: 1
        rrf:
          weights:
          - 1
          - 1
  match-all:
    search:
      keyword:
        match: all
      hybrid:
        rrf:
          weights:
          - 1
          - 2
  lang-fuzzy:
    index: *id001
    search:
      keyword:
        fuzzy: 1
      hybrid:
        rrf:
          k: 20
  alt-c:
    search:
      hybrid:
        rrf:
          weights:
          - 2
          - 1
